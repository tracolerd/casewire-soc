<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="500" viewBox="0 0 1600 500" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">Casewire SOC — security operations and case investigation workflow</title>
  <desc id="desc">A dark security operations banner showing a rule-based signal moving through detection, alert grouping, and a traceable investigation case.</desc>
  <defs>
    <linearGradient id="bg" x1="45" y1="8" x2="1550" y2="490" gradientUnits="userSpaceOnUse">
      <stop stop-color="#07131D"/>
      <stop offset=".52" stop-color="#0B202D"/>
      <stop offset="1" stop-color="#11162A"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#5EEAD4"/>
      <stop offset=".55" stop-color="#38BDF8"/>
      <stop offset="1" stop-color="#A78BFA"/>
    </linearGradient>
    <linearGradient id="panel" x1="930" y1="95" x2="1500" y2="420" gradientUnits="userSpaceOnUse">
      <stop stop-color="#122D3A"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <radialGradient id="halo" cx="0" cy="0" r="1" gradientTransform="translate(1260 225) rotate(90) scale(300 410)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0D9488" stop-opacity=".24"/>
      <stop offset=".58" stop-color="#0D9488" stop-opacity=".08"/>
      <stop offset="1" stop-color="#0D9488" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M30 0H0V30" stroke="#9EECE4" stroke-opacity=".07" stroke-width="1"/>
    </pattern>
    <pattern id="microdots" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#BAE6FD" fill-opacity=".2"/>
    </pattern>
    <filter id="shadow" x="-25%" y="-25%" width="150%" height="160%">
      <feDropShadow dx="0" dy="13" stdDeviation="16" flood-color="#020617" flood-opacity=".45"/>
    </filter>
    <filter id="softGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1600" height="500" rx="28" fill="url(#bg)"/>
  <rect width="1600" height="500" rx="28" fill="url(#grid)"/>
  <rect width="1600" height="500" rx="28" fill="url(#halo)"/>
  <rect x="820" y="0" width="780" height="500" fill="url(#microdots)" opacity=".3"/>
  <path d="M0 405C252 335 404 470 640 409S1008 341 1215 389S1461 409 1600 344V500H0V405Z" fill="#030712" fill-opacity=".37"/>
  <path d="M66 77H91" stroke="url(#accent)" stroke-width="4" stroke-linecap="round"/>
  <text x="106" y="83" fill="#99F6E4" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="700" letter-spacing="4.2">SECURITY OPERATIONS WORKBENCH  /  006</text>

  <text x="78" y="177" fill="#F0FDFA" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="70" font-weight="800" letter-spacing="-2.5">Casewire SOC</text>
  <rect x="83" y="199" width="94" height="5" rx="2.5" fill="url(#accent)"/>
  <text x="82" y="252" fill="#C7E7EE" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="26" font-weight="500">From security signals to traceable investigations.</text>
  <text x="84" y="296" fill="#8FAAB9" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18">A deterministic detection and incident case-management demonstrator.</text>

  <g font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="700" letter-spacing="1.15">
    <rect x="83" y="337" width="225" height="40" rx="20" fill="#0F766E" fill-opacity=".19" stroke="#5EEAD4" stroke-opacity=".62"/>
    <circle cx="104" cy="357" r="4" fill="#5EEAD4"/>
    <text x="119" y="362" fill="#A7F3D0">RULE-BASED DETECTION</text>
    <rect x="322" y="337" width="198" height="40" rx="20" fill="#2563EB" fill-opacity=".15" stroke="#7DD3FC" stroke-opacity=".55"/>
    <circle cx="343" cy="357" r="4" fill="#7DD3FC"/>
    <text x="358" y="362" fill="#BAE6FD">CASE TRACEABILITY</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="858" y="74" width="665" height="356" rx="22" fill="url(#panel)" stroke="#7DD3FC" stroke-opacity=".24"/>
    <path d="M880 75H1500" stroke="url(#accent)" stroke-width="2" stroke-opacity=".75"/>
  </g>
  <g font-family="Inter,Segoe UI,Arial,sans-serif">
    <circle cx="890" cy="104" r="4" fill="#5EEAD4"/>
    <text x="906" y="109" fill="#D9F4F5" font-size="13" font-weight="700" letter-spacing="2">INVESTIGATION PIPELINE</text>
    <text x="1484" y="109" fill="#7896A7" font-size="11" text-anchor="end" letter-spacing="1.1">LOCAL MVP</text>

    <path d="M936 183H1437" stroke="#5EEAD4" stroke-opacity=".42" stroke-width="2" stroke-linecap="round"/>
    <path d="M1057 183H1071M1186 183H1200M1315 183H1329" stroke="#A5F3FC" stroke-width="2" stroke-linecap="round"/>
    <path d="M1067 178L1073 183L1067 188M1196 178L1202 183L1196 188M1325 178L1331 183L1325 188" stroke="#A5F3FC" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <g>
      <circle cx="936" cy="183" r="28" fill="#0F766E" fill-opacity=".25" stroke="#5EEAD4" stroke-opacity=".75"/>
      <path d="M921 184H926L930 174L936 193L942 179L946 184H951" stroke="#99F6E4" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="1073" cy="183" r="28" fill="#0369A1" fill-opacity=".24" stroke="#7DD3FC" stroke-opacity=".75"/>
      <path d="M1073 166L1085 171V181C1085 190 1079 196 1073 199C1067 196 1061 190 1061 181V171L1073 166Z" stroke="#BAE6FD" stroke-width="2" stroke-linejoin="round"/>
      <path d="M1068 182L1072 186L1079 177" stroke="#BAE6FD" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="1202" cy="183" r="28" fill="#92400E" fill-opacity=".22" stroke="#FBBF24" stroke-opacity=".8"/>
      <path d="M1202 167L1217 193H1187L1202 167Z" stroke="#FDE68A" stroke-width="2" stroke-linejoin="round"/>
      <path d="M1202 177V184M1202 188V189" stroke="#FDE68A" stroke-width="2.4" stroke-linecap="round"/>
      <circle cx="1331" cy="183" r="28" fill="#5B21B6" fill-opacity=".22" stroke="#C4B5FD" stroke-opacity=".8"/>
      <rect x="1319" y="170" width="24" height="26" rx="3" stroke="#DDD6FE" stroke-width="2"/>
      <path d="M1325 178H1337M1325 184H1337M1325 190H1333" stroke="#DDD6FE" stroke-width="2" stroke-linecap="round"/>
    </g>
    <g font-size="12" font-weight="700" text-anchor="middle" letter-spacing=".8">
      <text x="936" y="230" fill="#B7EDE7">EVENT</text>
      <text x="1073" y="230" fill="#BAE6FD">DETECT</text>
      <text x="1202" y="230" fill="#FDE68A">ALERT</text>
      <text x="1331" y="230" fill="#DDD6FE">CASE</text>
    </g>

    <rect x="888" y="256" width="605" height="1" fill="#7C9AAA" fill-opacity=".24"/>
    <text x="889" y="282" fill="#8CA7B7" font-size="11" font-weight="700" letter-spacing="1.6">SIGNAL EXAMPLE</text>
    <rect x="887" y="298" width="180" height="72" rx="12" fill="#0B1722" stroke="#5EEAD4" stroke-opacity=".25"/>
    <circle cx="906" cy="317" r="3.5" fill="#FBBF24"/>
    <text x="919" y="321" fill="#C7DDE5" font-size="11" font-weight="600">FAILED_LOGIN</text>
    <text x="902" y="344" fill="#F8FAFC" font-size="17" font-weight="700">3 events</text>
    <text x="902" y="359" fill="#7896A7" font-size="10">Within a 5-minute window</text>

    <path d="M1077 334H1090" stroke="#7DD3FC" stroke-opacity=".6" stroke-width="2" stroke-linecap="round"/>
    <path d="M1086 330L1091 334L1086 338" stroke="#7DD3FC" stroke-opacity=".8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

    <rect x="1100" y="298" width="172" height="72" rx="12" fill="#0B1722" stroke="#FBBF24" stroke-opacity=".28"/>
    <rect x="1115" y="312" width="5" height="42" rx="2.5" fill="#FBBF24" fill-opacity=".9"/>
    <text x="1131" y="321" fill="#FDE68A" font-size="11" font-weight="700">ALERT GROUP</text>
    <text x="1131" y="344" fill="#F8FAFC" font-size="14" font-weight="700">Brute-force rule</text>
    <text x="1131" y="359" fill="#7896A7" font-size="10">Threshold reached</text>

    <path d="M1282 334H1295" stroke="#C4B5FD" stroke-opacity=".7" stroke-width="2" stroke-linecap="round"/>
    <path d="M1291 330L1296 334L1291 338" stroke="#C4B5FD" stroke-opacity=".8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

    <rect x="1305" y="298" width="188" height="72" rx="12" fill="#0B1722" stroke="#C4B5FD" stroke-opacity=".3"/>
    <circle cx="1324" cy="318" r="4" fill="#A78BFA"/>
    <text x="1337" y="322" fill="#DDD6FE" font-size="11" font-weight="700">CASE CREATED</text>
    <text x="1320" y="344" fill="#F8FAFC" font-size="14" font-weight="700">Investigation</text>
    <text x="1320" y="359" fill="#7896A7" font-size="10">Notes · Tasks · Timeline</text>

    <text x="890" y="402" fill="#5EEAD4" font-size="11" font-weight="700" letter-spacing="1.2">DETERMINISTIC RULES</text>
    <circle cx="1061" cy="398" r="2" fill="#557184"/>
    <text x="1075" y="402" fill="#91AAB8" font-size="11">Synthetic / authorized data</text>
    <circle cx="1285" cy="398" r="2" fill="#557184"/>
    <text x="1299" y="402" fill="#91AAB8" font-size="11">Auditable case workflow</text>
  </g>
</svg>